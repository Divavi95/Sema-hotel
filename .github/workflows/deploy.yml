name: Deploy to Reg.ru Hosting

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync files to Reg.ru via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔄 Auto-bump Asset Cache Buster
        run: |
          BUILD_VER="$(date +'%Y%m%d_%H%M%S')"
          echo "Injecting automatic cache buster: ${BUILD_VER}"
          sed -i -E "s/styles\.css\?v=[^\"']+/styles.css?v=${BUILD_VER}/g" index.html
          sed -i -E "s/script\.js\?v=[^\"']+/script.js?v=${BUILD_VER}/g" index.html

      - name: 📂 Sync files to Reg.ru
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.31.196.158
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: www/semahotel.ru/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .gitignore
            README.md
            config.py
            server.py
            screenshot_*.png
            test_*.png
            temp_*.png
            *_crop_*.png
            *_full_*.png
            card_full_*.png
            contacts_part*.png
            faq_*_part*.png
            faq_*_full_*.png
            faq_*_bottom.png
            faq_*_tabs_*.png
            reviews_part*.png
            small_photo*.png
            assets/**
            raw_assets/**
            "Фотки на сайт"/**
